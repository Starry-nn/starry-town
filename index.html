<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Starry Town · Nan Yao</title>
<meta name="description" content="Nan Yao's portfolio as a little island you can walk around: visit the buildings, dig things up, go fishing. AI, venture, product and operations.">
<meta name="theme-color" content="#7ccfe0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%238ed68a'/%3E%3Cpath fill='%23ffcf4d' stroke='%23ffcf4d' stroke-width='2' stroke-linejoin='round' d='M16 6l3 7 7 .6-5.4 4.6 1.7 7L16 21.4 9.7 25.2l1.7-7L6 13.6l7-.6z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=26">
</head>
<body>
<canvas id="game" aria-label="An island map. Use the Quick view button for a plain version of the same content."></canvas>
<div id="labels"></div>

<header class="hud" id="hud">
  <div class="hud-left">
    <div class="hud-brand">
      <span class="hud-star" aria-hidden="true">★</span>
      <span class="hud-title">Starry Town</span>
      <span class="hud-name" id="hudName"></span>
    </div>
    <button class="quest" id="quest" hidden></button>
  </div>
  <div class="hud-actions">
    <span class="chip" id="hudCount" aria-live="polite"></span>
    <button class="btn" id="btnBag"></button>
    <button class="btn" id="btnQuick"></button>
    <a class="btn" id="btnCv" target="_blank" rel="noopener"></a>
    <button class="btn" id="btnLang" aria-label="Switch language"></button>
  </div>
</header>

<button class="prompt" id="prompt" hidden></button>
<button class="emote" id="btnDance" hidden><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12.5" cy="4.2" r="2.1" fill="currentColor"/><path d="M12.3 7.5l-.6 6M5 5.5l6.8 3.2 6-4.4M11.7 13.5l-4.4 2.4.7 4.6M11.7 13.5l5 2-1.4 5"/></svg></button>
<button class="emote emote-2 emote-ball" id="btnBall" hidden><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M5.2 6.8c3 2.4 3 8 0 10.4M18.8 6.8c-3 2.4-3 8 0 10.4"/></svg></button>
<button class="emote emote-2" id="btnMute" hidden></button>
<button class="emote emote-2 emote-card" id="btnCard" hidden><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5a2 2 0 0 1 2-2h2.2l1.3-2h7l1.3 2H19a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="12.6" r="3.4"/></svg></button>
<button class="emote emote-2 emote-map" id="btnMap" hidden><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6.5l6-2.5 6 2.5 6-2.5v13.5l-6 2.5-6-2.5-6 2.5z"/><path d="M9 4v13.5M15 6.5V20"/></svg></button>
<div class="camctl" id="camCtl" hidden>
  <button id="btnView" hidden><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12s3.5-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.5 6.5-9.5 6.5S2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></svg></button>
  <button id="btnZoomIn" hidden><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  <button id="btnZoomOut" hidden><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
</div>
<div class="say" id="say" hidden><span class="say-name" id="sayName"></span><p id="sayText"></p><span class="say-more" id="sayMore"></span></div>
<div class="toast" id="toast" hidden></div>

<section class="intro" id="intro">
  <div class="intro-card">
    <p class="intro-kicker" id="introKicker"></p>
    <h1 class="intro-title">Starry Town</h1>
    <p class="intro-sub" id="introSub"></p>
    <p class="intro-by" id="introBy"></p>
    <div class="intro-btns">
      <button class="btn btn-main" id="btnStart"></button>
      <a class="btn" id="btnQuick2" href="https://starry-nn.github.io/" target="_blank" rel="noopener"></a>
    </div>
    <ul class="keys" id="introKeys"></ul>
    <details class="intro-more" id="introMore"><summary id="introMoreSum"></summary><ul class="howto" id="introHow"></ul></details>
    <div class="intro-foot">
      <button class="btn btn-quiet" id="btnLang2"></button>
      <button class="btn btn-quiet" id="btnReset" hidden></button>
    </div>
  </div>
</section>

<dialog class="card" id="card">
  <div class="card-head">
    <div>
      <p class="card-kicker" id="cardKicker"></p>
      <h2 class="card-title" id="cardTitle"></h2>
      <p class="card-meta" id="cardMeta"></p>
    </div>
    <button class="btn btn-close" id="cardClose" aria-label="Close">✕</button>
  </div>
  <div class="card-body" id="cardBody"></div>
</dialog>

<noscript>
  <div class="noscript">
    <h1>Nan Yao</h1>
    <p>AI · Venture · Product · Operations. New York / Beijing / Shenzhen.</p>
    <p>This portfolio is an interactive island and needs JavaScript. You can reach me at
      <a href="mailto:yaonan1127@gmail.com">yaonan1127@gmail.com</a> or
      <a href="https://www.linkedin.com/in/yaonanstarry">LinkedIn</a>, or read my
      <a href="assets/Nan_Yao_Resume_EN.pdf">résumé</a>.</p>
  </div>
</noscript>

<script src="js/data.js?v=26"></script>
<script src="js/extras.js?v=26"></script>
<script src="js/avatar.js?v=26"></script>
<script src="js/text-keys.js?v=26"></script>
<script>document.write('<script src="js/text-overrides.js?t=' + Date.now() + '"><\/script>');</script>
<script type="module" src="js/game.js?v=26"></script>
</body>
</html>
