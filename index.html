<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Starry Town · Nan Yao</title>
<meta name="description" content="Nan Yao's portfolio as a little island you can walk around: visit the buildings, dig things up, go fishing. AI, venture, product and operations.">
<meta name="theme-color" content="#7ccfe0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%238ed68a'/%3E%3Cpath fill='%23ffcf4d' stroke='%23ffcf4d' stroke-width='2' stroke-linejoin='round' d='M16 6l3 7 7 .6-5.4 4.6 1.7 7L16 21.4 9.7 25.2l1.7-7L6 13.6l7-.6z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=13">
</head>
<body>
<canvas id="game" aria-label="An island map. Use the Quick view button for a plain version of the same content."></canvas>
<div id="labels"></div>

<header class="hud" id="hud">
  <div class="hud-left">
    <div class="hud-brand">
      <span class="hud-star" aria-hidden="true">★</span>
      <span class="hud-title">Starry Town</span>
      <span class="hud-name" id="hudName"></span>
    </div>
    <button class="quest" id="quest" hidden></button>
  </div>
  <div class="hud-actions">
    <span class="chip" id="hudCount" aria-live="polite"></span>
    <button class="btn" id="btnBag"></button>
    <button class="btn" id="btnQuick"></button>
    <a class="btn" id="btnCv" target="_blank" rel="noopener"></a>
    <button class="btn" id="btnLang" aria-label="Switch language"></button>
  </div>
</header>

<button class="prompt" id="prompt" hidden></button>
<button class="emote" id="btnDance" hidden>💃</button>
<button class="emote emote-2" id="btnMute" hidden>🔊</button>
<div class="say" id="say" hidden><span class="say-name" id="sayName"></span><p id="sayText"></p><span class="say-more" id="sayMore"></span></div>
<div class="toast" id="toast" hidden></div>

<section class="intro" id="intro">
  <div class="intro-card">
    <p class="intro-kicker" id="introKicker"></p>
    <h1 class="intro-title">Starry Town</h1>
    <p class="intro-sub" id="introSub"></p>
    <ul class="howto" id="introHow"></ul>
    <div class="intro-btns">
      <button class="btn btn-main" id="btnStart"></button>
      <button class="btn" id="btnQuick2"></button>
      <button class="btn" id="btnLang2"></button>
      <button class="btn" id="btnReset" hidden></button>
    </div>
  </div>
</section>

<dialog class="card" id="card">
  <div class="card-head">
    <div>
      <p class="card-kicker" id="cardKicker"></p>
      <h2 class="card-title" id="cardTitle"></h2>
      <p class="card-meta" id="cardMeta"></p>
    </div>
    <button class="btn btn-close" id="cardClose" aria-label="Close">✕</button>
  </div>
  <div class="card-body" id="cardBody"></div>
</dialog>

<noscript>
  <div class="noscript">
    <h1>Nan Yao</h1>
    <p>AI · Venture · Product · Operations. New York / Beijing / Shenzhen.</p>
    <p>This portfolio is an interactive island and needs JavaScript. You can reach me at
      <a href="mailto:yaonan1127@gmail.com">yaonan1127@gmail.com</a> or
      <a href="https://www.linkedin.com/in/yaonanstarry">LinkedIn</a>, or read my
      <a href="assets/Nan_Yao_Resume_EN.pdf">résumé</a>.</p>
  </div>
</noscript>

<script src="js/data.js?v=13"></script>
<script src="js/extras.js?v=13"></script>
<script type="module" src="js/game.js?v=13"></script>
</body>
</html>
